name: Publicar pacote npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Instalar as dependências
        run: npm --prefix cli ci

      - name: Validar a release
        run: npm run release:check

      - name: Conferir a versão no npm
        id: registry
        working-directory: cli
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@promovaweb/brandfy@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar com provenance
        if: steps.registry.outputs.published == 'false'
        working-directory: cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
